<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>微雪 1.75-B 展示端 · 466×466</title>
<style>
  :root{
    --scr: 466px;
    --amber:#ffb020;
    --green:#3ddc84;
    --red:#ff4545;
    --dim:#5a6472;
    --ink:#e8edf4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#15181d;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
    display:flex;gap:34px;align-items:flex-start;padding:30px;
  }
  .stage{display:flex;flex-direction:column;gap:14px;align-items:center}
  .bezel{
    width:calc(var(--scr) + 26px);height:calc(var(--scr) + 26px);
    border-radius:50%;
    background:linear-gradient(150deg,#3a3f47,#1b1e23 45%,#2c3138);
    display:grid;place-items:center;
    box-shadow:0 22px 50px rgba(0,0,0,.6), inset 0 1px 2px rgba(255,255,255,.18);
  }
  .screen{
    width:var(--scr);height:var(--scr);border-radius:50%;
    background:#000;overflow:hidden;position:relative;
    touch-action:none;
  }
  svg{display:block}
  .hint{font:12px/1.6 ui-monospace,Consolas,monospace;color:#7c8697;text-align:center}
  .panel{
    background:#1c2027;border:1px solid #2b313a;border-radius:12px;
    padding:16px 18px;min-width:330px;max-width:380px;
    font:12px/1.7 ui-monospace,Consolas,monospace;color:#aeb9c9;
  }
  .panel h2{font:600 13px/1 sans-serif;color:#dfe6ef;margin-bottom:10px;letter-spacing:.5px}
  .panel .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #262c35;padding:3px 0}
  .panel .row b{color:#e8edf4;font-weight:600}
  .ask{display:flex;gap:6px;margin:0 0 12px}
  .ask input{
    flex:1;background:#12161c;border:1px solid #2b313a;border-radius:8px;
    color:#e8edf4;padding:6px 8px;font:12px/1.4 ui-monospace,Consolas,monospace;
  }
  .ask button{
    background:#2b313a;color:#aeb9c9;border:0;border-radius:8px;padding:6px 9px;
    font:12px/1 sans-serif;cursor:pointer;
  }
  .ask #askprobe{color:#ffb020}
  .log{height:210px;overflow:auto;margin-top:10px;white-space:pre-wrap;word-break:break-all;color:#7f8a9b}
</style>
</head>
<body>
<div class="stage">
  <div class="bezel"><div class="screen" id="screen"><svg id="ui" viewBox="0 0 466 466" width="466" height="466"></svg></div></div>
  <div class="hint" id="hint">等待连接…</div>
</div>
<div class="panel" id="panel">
  <h2>对话（冒充麦克风那条链路）</h2>
  <div class="ask">
    <input id="askbox" placeholder="随便说一句，回车即发">
    <button id="asksend">发送</button>
    <button id="askprobe" title="故意说一句红线里的话，看手机端拦不拦">越界探针</button>
  </div>
  <h2>原始状态流</h2>
  <div id="kv"></div>
  <div class="log" id="log"></div>
</div>

<script>
// 这页是调 UI 用的，画错了必须当场看见，否则只会对着静止画面猜
window.onerror=(m,f,l,c)=>{
  const d=document.getElementById('log');
  if(d) d.textContent=`ERR ${m} @${l}:${c}\n`+d.textContent;
};
const NS='http://www.w3.org/2000/svg';
const ui=document.getElementById('ui');
const cx=233, cy=233;
let last=null, lastSeq=-1, connected=false;
// 状态帧的 seq 是服务端自增，事件帧走另一条计数；两者都要留痕才能判断是不是重发
let lastStateAt=0, outSeq=0, ws=null;
const seenEvents=[];                     // event_id 去重环形缓冲，契约规定留 32 个

// 对话（契约 v2）。屏上这一份只是"看得见的那几行"，**真正的记录在手机上**：
// 断开重连后由手机把它那条时间线的最后几轮重新推下来，屏不自己攒（见 screen-link.md 的对话段）
let dialog=[], dialogMode=false, dialogIdle=null, micHeld=false, DIALOG_VIEW=[];
let dq=0;
// 每次开页一个随机段。手机的记录按 turn_id 去重且**跨连接有效**，纯自增的 id 在页面刷新后
// 会从 s-0 重新开始，撞上记录里的旧 id —— 表现是"重连后头几句问了没反应"
const BOOT=Math.random().toString(36).slice(2,6);
const DIALOG_Q=['车到哪了','还剩几条额度','链路现在怎么样','现在能发 SOS 吗','下次过境什么时候'];
// 说完/答完 25 秒自己回到状态盘：这块屏的日常身份是"车载状态表"，不是聊天窗口
const IDLE_MS=25000;

function el(tag,attrs,parent){
  const n=document.createElementNS(NS,tag);
  for(const k in attrs) n.setAttribute(k,attrs[k]);
  (parent||ui).appendChild(n);
  return n;
}
function text(x,y,str,o,parent){
  const t=el('text',Object.assign({x,y,'text-anchor':'middle',fill:'#e8edf4',
    'font-family':'Segoe UI, Microsoft YaHei, sans-serif'},o||{}),parent);
  t.textContent=str; return t;
}
function arc(r,a0,a1,color,w,opacity){
  const p=(a)=>[cx+r*Math.cos(a), cy+r*Math.sin(a)];
  const [x0,y0]=p(a0), [x1,y1]=p(a1);
  const large=(a1-a0)>Math.PI?1:0;
  return el('path',{d:`M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1}`,
    stroke:color,'stroke-width':w,fill:'none','stroke-linecap':'round',opacity:opacity||1});
}

// 文案全部照 §6.1 红线一写：星上应答 ≠ 平台回执 ≠ 有人在路上。tx_ok 那一档以前写的是禁用句
const PHASE_CN={idle:'待命',searching:'对星中',locked:'已锁定',tx_pending:'待发',tx_ok:'星上已应答',tx_fail:'发送失败',tx_no_ack:'星上未确认'};
const LINK_CN={cell:'蜂窝主链路',sat:'卫星主链路'};

/**
 * §6.1 红线一的词表，屏上这一份和手机那一组是同一套口径。
 * **手机的闸管得到过网关的话，管不到小智官方云直接往屏上画的那一路**（路线 A 的全部风险就在这），
 * 所以凡是要上屏的文字都再过一次。宁可屏上少一句，也不能现场冒出一句"救援已在路上"。
 */
const BANNED=['已送达','发送成功','送达成功','救援已在路上','平台已受理','一定没问题'];   /* 红线样本：这一行是闸自己的词表，不是往屏上画的话 */
function guardText(t){
  const s=String(t==null?'':t);
  return BANNED.some(b=>s.includes(b)) ? '这句我不能替平台说，以手机台账为准' : s;
}

/**
 * 上面那两行小字是这屏最贵的地方：**一条只说一件事**，且优先级写死。
 * 现场最容易犯的错是把「星历算不出」显示成「无卫星信号」，用户会举着天线在空旷处干等。
 */
function topLines(s){
  const sat=s.sat||{}, out=[];
  if(sat.tpi_stale===true)
    out.push(['位置已过期，卫星可能投递失败', sat.tpi_age_s!=null?`${Math.round(sat.tpi_age_s/60)} 分钟前推送`:'', '#ff4545']);
  if(typeof sat.eph_fail==='string' && sat.eph_fail)
    out.push([sat.eph_fail, '', '#ffb020']);            // 这句由 App 出成品文案，固件不许自己编
  if(sat.upgrade_pct!=null)
    out.push(['模组升级中 '+sat.upgrade_pct+'%', '发送已锁', '#ffb020']);
  const offline=sat.module_ok===false;
  if(!offline && sat.phase!=='locked' && sat.next_pass_in_s!=null && sat.next_pass_in_s>0){
    let line='距下次过顶 '+sat.next_pass_in_s+'s';
    if(sat.next_pass_dur_s>0) line+=' · 窗口 '+sat.next_pass_dur_s+'s';     // 0 是"还没算出来"，不是"窗口 0 秒"
    if(sat.next_pass_max_el>0) line+=' · 最大仰角 '+Math.round(sat.next_pass_max_el)+'°';
    out.push([line, '', '#ffb020']);
  }
  if(out.length<2 && sat.queue_dropped)
    out.push(['队满丢过 '+sat.queue_dropped+' 条', '不是零丢失', '#ff4545']);
  return out.slice(0,2);
}

function draw(s){
  ui.textContent='';
  el('circle',{cx,cy,r:232,fill:'#000'});

  // 3 秒没状态就把外圈打灰（screen-link.md §保活）。断线时留最后一帧，不许黑屏
  const stale=(Date.now()-lastStateAt)>3000 && connected;

  // 外圈：链路。蜂窝=绿实线弧，卫星=琥珀弧
  const sat = s.link.primary==='sat';
  arc(226,-Math.PI*0.78,Math.PI*0.78,'#1b222c',5);
  if(!sat) arc(226,-Math.PI*0.78,Math.PI*0.78, stale?'#5a6472':'#3ddc84',5);
  else { arc(226,-Math.PI*0.78,Math.PI*0.78, stale?'#5a6472':'#ffb020',5); arc(226,Math.PI*0.78,Math.PI*1.22,'#ffb020',5,.55); }

  // 卫星相位环
  const ph=s.sat.phase, order=['idle','searching','locked','tx_pending','tx_ok','tx_fail','tx_no_ack'];
  const fill={idle:0,searching:.35,locked:.85,tx_pending:.55,tx_ok:1,tx_fail:.3,tx_no_ack:.2}[ph]||0;
  arc(206,-Math.PI/2,-Math.PI/2+Math.PI*2*fill, ph==='tx_fail'||ph==='tx_no_ack'?'#ff4545':'#ffb020',7);
  el('circle',{cx,cy,r:206,fill:'none',stroke:'#1b222c','stroke-width':7});

  // 中间那一块：对话模式换成这一轮的线程，**外圈链路环保留** —— 抬眼还是要知道链没连上。
  // 求救压过对话：sos 不是 normal 时强制回状态视图，新到的那几句话先攒着，等归位再画
  if(dialogMode && s.sos.level==='normal') drawDialog(s); else drawCenter(s, stale);

  drawPad(s);

  // SOS 横幅压在最上层。这时候轨迹盘不画：弹层只盖住它下半截，
  // 露出一条弧比什么都不露更乱 —— 一屏一重心，SOS 期间这屏上只有 SOS
  if(s.sos.level!=='normal') sosBanner(s);
}

/** 状态视图的中间那块：星名/相位/顶部小字/轨迹盘/底部位置电量。原来写在 draw() 里，抽出来只是为了让对话视图换得掉它 */
function drawCenter(s,stale){
  // 「终端离线」和「没锁到星」必须分开说：前者是 GT1005 掉电，后者只是在等过顶。
  const offline = s.sat.module_ok === false;
  const queued = s.sat.queue_pending || 0;
  const cap = s.sat.queue_capacity || null;
  text(cx,96,offline?'GT1005':(s.sat.sat_name||'—'),{'font-size':19,'letter-spacing':1.5,
    fill:offline?'#ff4545':(s.sat.sat_name?'#ffb020':'#5a6472')});
  text(cx,116,offline?(queued?`离线 · 攒 ${queued}${cap?'/'+cap:''} 条待补发`:'终端离线'):
      (s.sat.cnr?('CNR '+s.sat.cnr.toFixed(1)+' dB'):'未锁定'),{'font-size':12,fill:offline?'#aeb9c9':'#5a6472'});
  text(cx,138,offline?'终端离线':(PHASE_CN[s.sat.phase]||s.sat.phase),{'font-size':15,
    fill:offline?'#ff4545':'#e8edf4','font-weight':'600'});
  topLines(s).forEach((r,i)=>{
    text(cx,158+i*16,r[0],{'font-size':12,fill:r[2],'letter-spacing':.2});
    if(r[1]) text(cx+150,158+i*16,r[1],{'font-size':10,fill:'#5a6472','text-anchor':'end'});
  });

  if(s.sos.level==='normal') drawTrack(s);

  // 底部：位置 / 围栏 / 电量，最下面那块是触摸 SOS 区
  text(cx,326,`${s.gnss.lat.toFixed(5)}, ${s.gnss.lon.toFixed(5)}`,{'font-size':13,
    fill:(s.gnss.fix_age_s!=null && s.gnss.fix_age_s>30)?'#5a6472':'#aeb9c9'});
  text(cx,343,`源 ${s.gnss.source==='gt1005'?'GT1005':(s.gnss.source==='fused'?'融合':'手机GPS')}`+
      (s.gnss.fix_age_s!=null?`  ${s.gnss.fix_age_s.toFixed(0)}s前`:''),{'font-size':11,fill:'#5a6472'});
  if(s.fence.active)
    text(cx,361,s.fence.inside?`围栏内 · ${s.fence.name||''}`:`出界 ${Math.abs(s.fence.dist_m||0).toFixed(0)}m`,
      {'font-size':14,'font-weight':'600',fill:s.fence.inside?'#3ddc84':'#ff4545'});
  text(cx,376,`${s.phone_battery==null?'—':s.phone_battery+'%'}  ·  ${LINK_CN[s.link.primary]||s.link.primary}`,
    {'font-size':11,fill:'#5a6472'});
  drawMicPad(s);            // 状态视图里它是顶上那颗"按住问一句"
}

/**
 * 对话视图。这一屏的重心是"刚才是不是有人在车那边跟屏说话"，所以：
 * ① 问和答都要在（只有答的话，用户不知道它答的是哪句）；
 * ② **每条都要标这一轮从哪儿起的** —— 手机那边问的，和圆屏自己听到的，必须在屏上分得开；
 * ③ 小智云那一路的话不是我们网关生成的，标出来单独一档颜色，不能混进"主理人答"里。
 * 每屏只留最近三轮：这块屏 466dp，多一行就要开始折行，折两行就压到下面那颗 SOS 键上了。
 */
function drawDialog(s){
  DIALOG_VIEW=[];
  const g=el('g',{});
  text(cx,100,'主理人',{'font-size':12,fill:'#5a6472','letter-spacing':2},g);
  if(!dialog.length){
    text(cx,196,'按住下方说一句',{'font-size':19,fill:'#aeb9c9'},g);
    text(cx,222,'手机那边问的、答的，都会出现在这儿',{'font-size':11,fill:'#5a6472'},g);
  }
  let y=136;
  dialog.slice(-3).forEach(d=>{
    if(y>262) return;                      // 再往下就压到说话键了，宁可少画一轮
    text(cx,y,dialogTag(d),{'font-size':10,fill:'#5a6472'},g); y+=16;
    const lines=wrapCjk(d.text,16);   // 别叫 ws：那名字是这条链路的 WebSocket
    const shown=lines.slice(0,2);
    // 只画两行，剩下的必须有省略号。砍掉半句而不提示，读的人会以为那句话本来就说到这儿
    if(lines.length>2) shown[1]=shown[1].replace(/[,，。、]$/,'')+'…';
    shown.forEach((t,i)=>{
      text(cx,y+i*18,t,{'font-size':15,fill:dialogColor(d)},g);
      DIALOG_VIEW.push({y:y+i*18,fill:dialogColor(d),str:t});
    });
    y+=18*2+10;
  });
  drawMicPad(s);
}

/** CJK 没有空格可分，按字符数硬折。真固件那边是 LVGL 的自动换行，这里只要形状对得上就行 */
function wrapCjk(str,max){
  const s=String(str==null?'':str);
  // 连续的字母数字算一个整体：把 GT1005 折成 "GT10 / 05" 是这屏最难看的一种错，
  // 而观众恰恰会盯着型号看
  const atoms=s.match(/[A-Za-z0-9]+|[\s\S]/g)||[];
  const out=[]; let cur='';
  for(const a of atoms){
    if(cur && (cur+a).length>max){
      // 逗号句号不能开新行（那一行读起来像上一句被腰斩）。宁可多挤一个字，也不让标点起头
      if(/^[，。、）？！:：]/.test(a)) { cur+=a; continue; }
      out.push(cur); cur=a;
    } else cur+=a;
  }
  if(cur) out.push(cur);
  return out.length?out:[''];
}

/** 每条线的角标。"问·手机"这一档是这次改动的核心：车主在圆屏上也要能看出这话是谁先起的头 */
function dialogTag(d){
  const who=d.origin==='phone'?'手机':'圆屏';
  if(d.dir==='up') return '问 · '+who;
  if(d.source==='xiaozhi_cloud') return '答 · 小智云 · 未过网关';
  if(d.source==='local_fallback') return '答 · 未接模型';
  if(d.source==='denied') return '答 · 权限拦截';
  return '答 · '+who+'起';
}

function dialogColor(d){
  if(d.dir==='up') return '#7f8a9b';
  if(d.source==='xiaozhi_cloud') return '#ffb020';
  if(d.source==='denied') return '#ff4545';
  return '#e8edf4';
}

/**
 * 说话键，两个位置：
 * 状态视图里它是圆心上方那个小药丸（那块地方是星名，点一下不会误触别的），
 * 对话视图里它挪到 SOS 那颗键正上方，因为这时候拇指本来就是往上搭的。
 * **SOS 那颗永不让位**：这块屏上任何"方便"都不能把唯一的安全入口挤掉。
 * 链路没通时它是灰的并且明说原因，而不是画一个按下去没反应的假键。
 */
function drawMicPad(s){
  const can=connected;
  const lab=!can?'链路没通 · 说不了':(micHeld?'松开发送':(dialogMode?'按住再说一句':'按住问一句'));
  const col=micHeld?'#388bfd':can?'#2b313a':'#1b1f26';
  if(dialogMode){
    const x=133,w=200,y=330,h=42;
    el('rect',{x,y,width:w,height:h,rx:20,ry:20,fill:col,
      stroke:micHeld?'#388bfd':(can?'#3a4150':'#20262e'),'stroke-width':1.5},ui);
    text(cx,y+26,lab,{'font-size':14,'font-weight':'600',fill:can?'#e8edf4':'#5a6472'},ui);
    MIC={x,y,w,h};
  }else{
    const x=166,w=134,y=44,h=26;
    el('rect',{x,y,width:w,height:h,rx:13,ry:13,fill:col,
      stroke:micHeld?'#388bfd':(can?'#3a4150':'#20262e'),'stroke-width':1.2},ui);
    text(cx,y+17,lab,{'font-size':11,'font-weight':'600',fill:can?'#aeb9c9':'#5a6472'},ui);
    ENTRY={x,y,w,h};
  }
}
let MIC={x:133,y:330,w:200,h:42};
let ENTRY={x:166,y:44,w:134,h:26};

/**
 * 触摸 SOS 区。真屏是一块 466×466 的圆触摸屏，这屏唯一该让人按的就是这里，
 * 所以它按 §3.1 的承诺来：**长按 3 秒、中途松手就取消**，发出去之后这一块直接变成「撤销」。
 * 位置在圆心正下方靠边，手指从侧面搭上来也够得着，且压不到轨迹盘。
 */
function drawPad(s){
  const x=130,w=206,y=388,h=46;
  const upgrading=s.sat.upgrade_pct!=null;
  const active=s.sos.level!=='normal' && s.sos.level!=='armed';
  const armed=s.sos.level==='armed';
  let col = active?'#ff4545' : armed?'#ffb020' : upgrading?'#3a4150' : '#ff4545';
  el('rect',{x,y,width:w,height:h,rx:23,fill:'#0b0d10'});
  el('rect',{x,y,width:w,height:h,rx:23,fill:col,opacity:upgrading?.10:.16});
  el('rect',{x,y,width:w,height:h,rx:23,fill:'none',stroke:col,'stroke-width':2,opacity:upgrading?.5:1});
  const label = press.count>0 ? `再按 ${press.count}`+' 秒'
    : upgrading ? '升级中 · 发送已锁'
    : active ? '点一下撤销 SOS'
    : armed ? '已布防 · 长按 3 秒可提前发出'
    : '长按 3 秒触发 SOS';
  text(cx,y+29,label,{'font-size':14,'font-weight':'600',
    fill:press.count>0?'#ffffff':(upgrading?'#5a6472':'#ff8a80')});
  if(press.count>0){
    const f=(3-press.count)/3;
    el('rect',{x:x+16,y:y+h-9,width:(w-32)*f,height:3,rx:1.5,fill:'#ffffff',opacity:.85});
  }
  PAD={x,y,w,h};
}
let PAD={x:130,y:388,w:206,h:46};

function drawTrack(s){
  const g=el('g',{});
  el('circle',{cx,cy,r:74,fill:'#071018',stroke:'#1e2833','stroke-width':1},g);
  for(let r=26;r<=74;r+=24) el('circle',{cx,cy,r,fill:'none',stroke:'#141d27','stroke-width':1},g);
  el('line',{x1:cx-74,y1:cy,x2:cx+74,y2:cy,stroke:'#141d27'},g);
  el('line',{x1:cx,y1:cy-74,x2:cx,y2:cy+74,stroke:'#141d27'},g);
  if(s.fence.active && !s.fence.inside){
    el('circle',{cx,cy,r:52,fill:'none',stroke:'#ff4545','stroke-width':2,'stroke-dasharray':'7 6',opacity:.85},g);
  } else if(s.fence.active){
    el('circle',{cx,cy,r:52,fill:'none',stroke:'#3ddc84','stroke-width':2,'stroke-dasharray':'7 6',opacity:.6},g);
  }
  // 该把车头/天线朝哪边：正北在上，按瞬时方位角插值。窗口内画出来，窗口外不硬编一个方向
  const az=s.sat.aim_az;
  if(az!=null){
    const a=az*Math.PI/180, L=66;
    const hx=cx+Math.sin(a)*L, hy=cy-Math.cos(a)*L;
    el('line',{x1:cx,y1:cy,x2:hx,y2:hy,stroke:'#388bfd','stroke-width':2.5,'stroke-linecap':'round'},g);
    el('circle',{cx:hx,cy:hy,r:5,fill:'#388bfd'},g);
    text(cx,cy-62,'N',{'font-size':10,fill:'#5a6472'},g);
  }
  // 轨迹：用 seq 造一条会动的线，硬件到位后换成 track_pull 的真实点
  const n=14, pts=[];
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*1.7-Math.PI*0.9, rr=10+i*3.2;
    pts.push([cx+rr*Math.cos(a)-14, cy+rr*Math.sin(a)+10]);
  }
  el('polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',
    stroke:'#4a5b6e','stroke-width':2,'stroke-linecap':'round',opacity:.9},g);
  const head=pts[pts.length-1];
  el('circle',{cx:head[0],cy:head[1],r:6,fill:'#aeb9c9'},g);
  el('circle',{cx:head[0],cy:head[1],r:11,fill:'none',stroke:'#aeb9c9',opacity:.35},g);
}

function sosHead(sos){
  // level 只说"走到哪一步"，sat_ack 才说"星上收没收到"。V1.7 之前这屏把两句拼成一句写死，
  // 结果星上没应答时横幅还在说「星上已收到」—— 那正是 §6.1 红线一最要命的一种错法
  if(sos.level==='armed') return '已布防 · 等触发';
  if(sos.level==='pending') return '触发中 · 正在发送';
  if(sos.level==='acked') return '平台已回执';
  return sos.sat_ack===true ? '星上已收到 · 等平台回执' : '星上还没应答 · 继续重试';
}

function sosBanner(s){
  const sos=s.sos;
  // SOS 没落地之前一直是红。星上应答只是"少了一半不确定"，不该让横幅换成黄色看着像快好了
  const col=sos.level==='acked'?'#3ddc84':(sos.level==='armed'?'#ffb020':'#ff4545');
  // 先压一块暗底。SOS 弹层压在地图上，不压住就看不清，演示时看不清等于没做
  el('rect',{x:0,y:180,width:466,height:104,fill:'#0b0d10',opacity:.9});
  el('rect',{x:53,y:190,width:360,height:84,rx:16,fill:col,opacity:.16});
  el('rect',{x:53,y:190,width:360,height:84,rx:16,fill:'none',stroke:col,'stroke-width':2});
  text(cx,222,'SOS '+sosHead(sos),{'font-size':20,'font-weight':'700',fill:col});
  // 标题已经说了"星上收没收到"，这一行就不重复一遍，只补次数和成因
  text(cx,244,(sos.attempts||0)+' 次发送'+
      (sos.level==='acked'&&sos.sat_ack===true?' · 星上已应答':'')+
      (sos.fail?' · '+sos.fail:''),
    {'font-size':12,fill:'#aeb9c9'});
  if(sos.level!=='acked') text(cx,264,'撤销见下方按钮',
    {'font-size':11,fill:'#5a6472'});
}

function renderKv(s){
  const kv=document.getElementById('kv');
  const rows=[
    ['链路',s.link.primary+(s.link.cell_ok?' / 蜂窝通':' / 蜂窝断')],
    ['卫星',[s.sat.module_ok===false?'offline':s.sat.phase,s.sat.sat_name,
      s.sat.queue_pending?('待补发'+s.sat.queue_pending):null,
      s.sat.queue_dropped?('丢'+s.sat.queue_dropped):null,
      s.sat.tpi_stale?'TPI 陈旧':null].filter(Boolean).join(' · ')],
    ['定位',`${s.gnss.lat.toFixed(5)},${s.gnss.lon.toFixed(5)} (${s.gnss.source})`],
    ['围栏',s.fence.active?(s.fence.inside?'界内':'出界 '+s.fence.dist_m+'m'):'未启用'],
    ['SOS',s.sos.level+(s.sos.attempts?' 第'+s.sos.attempts+'次':'')+
      (s.sos.sat_ack===true?' 星上应答':'')],
    ['哨兵',s.sentinel?(s.sentinel.armed?'布防':'解除'):'-'],
    ['演示模式',String(s.demo_mode)],
  ];
  kv.innerHTML=rows.map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
}

function note(txt,color){
  const d=document.getElementById('log');
  d.textContent=`${new Date().toLocaleTimeString()}  ${txt}\n`+d.textContent;
  if(color) d.style.color=color;
}

function handleFrame(chunk){
  for(const line of chunk.split('\n')){
    let m; try{ m=JSON.parse(line); }catch(e){ continue; }
    if(m.t==='state'){
      if(m.seq<=lastSeq) continue;
      lastSeq=m.seq; last=m.state; lastStateAt=Date.now();
      draw(m.state); renderKv(m.state);
      if(m.state.demo_mode===true) document.getElementById('panel').style.display='none';
      else document.getElementById('panel').style.display='';
    } else if(m.t==='event'){
      ackEvent(m);
      if(seenEvents.includes(m.event.event_id)) continue;      // 重发的那条不再弹第二次
      seenEvents.push(m.event.event_id);
      if(seenEvents.length>32) seenEvents.shift();
      note('事件 '+m.event.kind+' '+JSON.stringify(m.event.payload).slice(0,80));
      if(m.event.kind==='sos_triggered'||m.event.kind==='sos_failed') note('  ↑ 弹层', '#ff4545');
      if(m.event.kind==='sos_cancelled') note('  ↑ 已撤销', '#3ddc84');
    } else if(m.t==='dialog'){
      pushLine(m.dialog);
    } else if(m.t==='ack'){
      const a=m.ack||{};
      note('回执 for_seq='+(a.for_seq!=null?a.for_seq:a.forSeq)+(a.error?' 拒：'+a.error:''));
    }
  }
}

/** 契约规定 event 必须回执，否则服务端 3 秒重发一次、再 3 秒放弃并记一条「展示端没收到」 */
function ackEvent(m){
  if(!ws || ws.readyState!==1) return;
  ws.send(JSON.stringify({v:2,t:'ack',seq:outSeq++,ts:Math.floor(Date.now()/1000),
    ack:{for_seq:m.seq, for_event_id:m.event.event_id}}));
}

function sendCmd(cmd,args){
  if(!ws || ws.readyState!==1){ note('链路没通，指令发不出去','#ff4545'); return; }
  ws.send(JSON.stringify({v:2,t:'command',seq:outSeq++,ts:Math.floor(Date.now()/1000),
    command:{cmd,args:args||{}}}));
  note('指令 '+cmd);
}

/**
 * 屏上"说一句话"。这块冒充件没有真的麦克风链路（附录 A.3 那条要等固件：板载双麦 + ES7210 + VAD），
 * 所以按住说话 = 念一句预置问题，右侧面板那个输入框才是随便说。
 * **两种入口都走这里**，发出去的帧完全一致 —— 否则冒充件测到的和真固件发的不是同一件事。
 */
function ask(line,source){
  if(!ws || ws.readyState!==1){ note('链路没通，话发不出去','#ff4545'); return; }
  const q=(line||'').trim();
  if(!q) return;
  const id='s-'+BOOT+'-'+outSeq, src=source||'asr';
  ws.send(JSON.stringify({v:2,t:'dialog',seq:outSeq++,ts:Math.floor(Date.now()/1000),
    dialog:{turn_id:id,dir:'up',text:q,source:src,origin:'screen'}}));
  pushLine({turn_id:id,dir:'up',text:q,source:src,origin:'screen'});
}

/**
 * 收到一条对话（dir=down 是手机答的，dir=up 是我们自己发出去又被镜像回来的）。
 * 去重按 turn_id+dir：**同一条问话本地记一次、服务端再回一次，屏上不能出现两遍**。
 * 自动切进对话视图 —— 用户在车那边说话，屏却还画着轨迹盘，等于没响应。
 */
function pushLine(raw){
  if(!raw || !raw.text) return;
  // 出站帧走了 encodeDefaults，缺省字段是不上线的：**收的一方必须自己补回同一套默认值**，
  // 否则 d.source 是 undefined，角标会一路掉进兜底那档，把"未接模型"显示成"手机起"
  const d={turn_id:'',dir:'down',text:'',source:'local_rule',skill:null,origin:'screen',...raw};
  const safe=guardText(d.text);
  if(safe!==d.text) note('对话红线拦截：原文没上屏','#ff4545');
  d.text=safe;
  const i=dialog.findIndex(x=>x.turn_id===d.turn_id && x.dir===d.dir);
  if(i>=0) dialog[i]=d; else dialog.push(d);
  while(dialog.length>6) dialog.shift();
  dialogMode=true;
  clearTimeout(dialogIdle);
  dialogIdle=setTimeout(()=>{ dialogMode=false; if(last) draw(last); },IDLE_MS);
  note('对话 '+(d.dir==='up'?'我说':'它答')+'：'+d.text);
  if(last) draw(last);
}

// ── 触摸：长按 3 秒 / 中途松手取消 / 发出后点一下撤销 ──────────────────────────
const press={timer:null,count:0};
const screen=document.getElementById('screen');

function hitRect(r,evt){
  const b=screen.getBoundingClientRect();
  const sx=(evt.clientX-b.left)/b.width*466, sy=(evt.clientY-b.top)/b.height*466;
  return sx>=r.x && sx<=r.x+r.w && sy>=r.y && sy<=r.y+r.h;
}
function hitPad(evt){ return hitRect(PAD,evt); }

function stopPress(fired){
  if(press.timer){ clearInterval(press.timer); press.timer=null; }
  if(press.count>0 && !fired) note('长按中断，SOS 未触发','#7c8697');
  press.count=0;
  if(last) draw(last);
}

/** 松开发送，取消（手指滑走）不发。真固件那边 VAD 会自己判尾，这一句只对应"按住/松开"这对动作 */
function releaseMic(send){
  if(!micHeld) return;
  micHeld=false;
  if(send) ask(DIALOG_Q[dq++%DIALOG_Q.length]);
  else if(last) draw(last);
}

screen.addEventListener('pointerdown',(e)=>{
  if(!last) return;
  // SOS 期间不给说话：那屏上只有求救，任何"顺便问一句"的邀请都是在分走注意力
  const sosOn=last.sos.level!=='normal';
  const onMic=!sosOn && (dialogMode ? hitRect(MIC,e) : hitRect(ENTRY,e));
  if(onMic){
    if(!connected){ note('链路没通，说不了','#ff4545'); return; }
    micHeld=true; draw(last); return;
  }
  if(!hitPad(e)){
    // 对话模式里点别处 = 收起回状态盘。SOS 那块位置不动，所以收起不会误触它
    if(dialogMode){ dialogMode=false; clearTimeout(dialogIdle); draw(last); }
    return;
  }
  if(last.sat.upgrade_pct!=null){ note('升级写锁生效，按钮已置灰','#ffb020'); return; }
  if(last.sos.level!=='normal' && last.sos.level!=='armed'){ sendCmd('sos_cancel'); return; }
  press.count=3; draw(last);
  press.timer=setInterval(()=>{
    press.count--;
    if(press.count<=0){ stopPress(true); sendCmd('sos_press'); note('触发已发出，撤销在下方','#ff4545'); }
    else draw(last);
  },1000);
});
screen.addEventListener('pointerup',()=>{ releaseMic(true); stopPress(false); });
['pointercancel','pointerleave'].forEach(ev=>screen.addEventListener(ev,()=>{ releaseMic(false); stopPress(false); }));

// 右侧面板那个输入框：冒充"随便说一句"。它和按住说话发的是同一种帧，只是文本从键盘来
(function wirePanelAsk(){
  const box=document.getElementById('askbox'), btn=document.getElementById('asksend'), probe=document.getElementById('askprobe');
  if(btn) btn.onclick=()=>{ if(box){ ask(box.value); box.value=''; } };
  if(box) box.onkeydown=(e)=>{ if(e && (e.key==='Enter'||e.keyCode===13)){ ask(box.value); box.value=''; } };
  // 越界探针：故意让"屏"说一句红线里的话，看手机端那道闸拦不拦。
  // 这一颗键存在的理由：红线不能只约束我们写的模板，它必须当着客户的面演一次才立得住
  if(probe) probe.onclick=()=>ask('救援已在路上','xiaozhi_cloud');   /* 红线样本：故意念一句越界的话，验两道闸都拦得住 */
})();

// ?ask=某句话：建好链就自动说一句。截图脚本和现场"一键演示这句"都靠它，走的是同一个 ask()
const AUTO_ASK=new URLSearchParams(location.search).get('ask');
if(AUTO_ASK) setTimeout(()=>ask(AUTO_ASK),1200);

function connect(){
  ws=new WebSocket(`ws://127.0.0.1:8443`);
  ws.onopen=()=>{
    connected=true; lastStateAt=Date.now();
    document.getElementById('hint').textContent='已连接 · 状态 1Hz 推送 · 契约 v2 可对话';
    ws.send(JSON.stringify({v:2,t:'hello',seq:outSeq++,
      hello:{screen_id:'WS175B-A3F7',fw:'sim-0.3.0',dock_type:'desk_stand',wifi_rssi:-52,battery_mv:4080,protocols:[1,2]}}));
  };
  ws.onmessage=(ev)=>handleFrame(ev.data);
  ws.onclose=()=>{
    connected=false;
    const h=document.getElementById('hint');
    let secs=0;
    h.textContent='链路中断 00:00 · 保留最后一帧';
    h.style.color='#ff4545';
    const t=setInterval(()=>{
      if(connected){clearInterval(t);return;}
      secs++;
      h.textContent=`链路中断 00:${String(secs).padStart(2,'0')} · 保留最后一帧`;
    },1000);
    setTimeout(connect,2000);
  };
  ws.onerror=()=>ws.close();
}

// 保活看的是 state 帧本身：契约不做独立心跳，1Hz 快照就是心跳
setInterval(()=>{
  if(!connected) return;
  const gap=Math.round((Date.now()-lastStateAt)/1000);
  if(gap>10){ note('10 秒没状态，主动重连','#ff4545'); try{ws.close();}catch(e){} return; }
  if(gap>3){
    const h=document.getElementById('hint');
    h.textContent=`状态已 ${gap}s 没更新 · 保留最后一帧`;
    h.style.color='#ffb020';
    if(last) draw(last);
  }
},1000);

// 关页面时先道别，App 台账上那台屏才能立刻变离线
window.addEventListener('pagehide',()=>{
  if(ws && ws.readyState===1) ws.send(JSON.stringify({v:2,t:'bye',seq:outSeq++}));
});

// 服务还没起来时先画一帧静态图，避免白屏
draw({link:{primary:'cell',cell_ok:true,sat_ok:false},
  sat:{phase:'idle'},gnss:{lat:30.2741,lon:120.1551,source:'phone',fix_age_s:0},
  fence:{active:false,inside:true},sos:{level:'normal',attempts:0},
  phone_battery:63,demo_mode:false});

// ?replay=xxx.jsonl —— 回放驱动器录下来的一轮，不连 ws。
// 调 UI 和批量出静帧都用它：headless 浏览器抢 ws 首帧不稳，回放是确定的。
const replay=new URLSearchParams(location.search).get('replay');
if(replay && /^[\w.\-]+$/.test(replay)){
  fetch('/'+replay).then(r=>{
    if(!r.ok) throw new Error(r.status);
    return r.text();
  }).then(t=>{
    connected=true;   // 回放录的就是连着的那一段。不置这一位，静帧上那颗说话键是灰的，看着像链路没通
    t.split('\n').filter(Boolean).forEach(handleFrame);
    document.getElementById('hint').textContent='回放 '+replay+' · 已定格在最后一帧';
  }).catch(e=>{
    document.getElementById('hint').textContent='回放读不到：'+e;
  });
} else connect();
</script>
</body>
</html>
